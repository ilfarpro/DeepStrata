name: Python tests

# Everything in the checkout that runs without a graphics card: the lint, the three suites the release gate
# runs (`tests/terminal tests/serve tests/tools`, the same command packaging/release.py --skip-tests turns
# off), and a collection check that fails on a module that no longer imports.
#
# Why this exists: before it, tests/terminal - 197 files - ran nowhere but the release, and python-tests.yml
# ran 11 of the 108 files in tests/tools; a pull request could break any of them and stay green. The suites
# run one directory per job so a red check names the area, and under pytest-xdist because their wall time is
# almost all waiting, not computing (tests/tools: 12 min -> 1.5 min on 4 workers).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # The monitor tests drive a Textual app. A dumb terminal (or a NO_COLOR exported by the runner) turns
  # colours off, and the light-theme tests then read the dark palette.
  TERM: xterm-256color
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint and collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install the runtime packages, ruff and pytest
        run: >
          python -m pip install --disable-pip-version-check
          -r requirements.txt -r requirements-monitor.txt pytest ruff==0.17.4
      # pyproject.toml holds the rule set: it has to stay green, so it is the rules that find a program
      # that cannot run, and it is widened in the change that fixes what a wider set reports.
      - name: Lint the tree
        run: python -m ruff check .
      # A test module that cannot import is a test nobody notices is gone. Two seconds for the whole tree.
      - name: Collect every test
        run: python -m pytest --collect-only -q tests

  suite:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # tests/terminal is the biggest and the slowest; tests/serve and tests/tools are the other two the
        # release gate runs. The last entry adds the suite directories that ran in no workflow at all
        # (395 tests, 5 s): a directory that starts running tests belongs in this list.
        suite:
          - tests/tools
          - tests/serve
          - tests/terminal
          - tests/tuning tests/split tests/time_skip
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install the runtime and monitor packages
        run: >
          python -m pip install --disable-pip-version-check
          -r requirements.txt -r requirements-monitor.txt pytest pytest-xdist
      # -n 4: the runners have 2-4 cores and these tests wait more than they compute. A test that starts the
      # real server on a loopback port or kills a download mid-file still has slack; nothing here is timed.
      - name: Run ${{ matrix.suite }}
        run: python -m pytest ${{ matrix.suite }} -q -n 4 --durations=10
